---
image: "ruby"

# Cache gems in between builds
cache:
  paths:
    - vendor/ruby

before_script:
  - gem install bundler -N
  - bundle config set path vendor
  - bundle install -j $(nproc)

rubocop:
  script:
    - bundle exec rubocop lib/ -f p -f ju -o junit.xml
  artifacts:
    reports:
      junit: junit.xml

pages:
  before_script: []
  script:
    - gem install yard rdoc redcarpet
    - yard doc -o public/
  artifacts:
    paths:
      - public/
  only:
    - master

rake:
  parallel:
    matrix:
      - RUBY_VERSION:
          - 'ruby:3.0'
          - 'ruby:3.1'
          - 'ruby:3.2'
          - 'ruby:4.0'
  image: ghcr.io/ruby/$RUBY_VERSION
  script:
    - bundle exec rake
